name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/app/node_modules
            apps/api/node_modules
            packages/shared/node_modules
            packages/db/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      # Cloudflare only accepts `wrangler secret put` after the Worker exists (initial deploy).
      - name: Deploy API Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun wrangler deploy

      - name: Sync API Worker secrets
        working-directory: apps/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLERK_ISSUER: ${{ secrets.CLERK_ISSUER }}
          CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          printf '%s' "$DATABASE_URL" | bun wrangler secret put DATABASE_URL
          printf '%s' "$SUPABASE_URL" | bun wrangler secret put SUPABASE_URL
          printf '%s' "$SUPABASE_SECRET_KEY" | bun wrangler secret put SUPABASE_SECRET_KEY
          printf '%s' "$CLERK_ISSUER" | bun wrangler secret put CLERK_ISSUER
          if [ -n "$CLERK_JWKS_URL" ]; then
            printf '%s' "$CLERK_JWKS_URL" | bun wrangler secret put CLERK_JWKS_URL
          fi
          if [ -n "$EXPO_ACCESS_TOKEN" ]; then
            printf '%s' "$EXPO_ACCESS_TOKEN" | bun wrangler secret put EXPO_ACCESS_TOKEN
          fi
          printf '%s' "$OPENAI_API_KEY" | bun wrangler secret put OPENAI_API_KEY

      - name: Build frontend
        working-directory: apps/app
        env:
          EXPO_PUBLIC_API_URL: https://jematala.takuk.me
        run: bun expo export -p web

      - name: Deploy frontend Worker
        working-directory: apps/app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun wrangler deploy
